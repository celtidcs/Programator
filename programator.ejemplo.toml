# Configuración de ejemplo de Programator.
#
# Cópialo a «programator.toml» en la misma carpeta que el ejecutable (no en el repositorio: ese
# fichero es tuyo, con tus rutas locales) y edítalo. Las rutas relativas de este fichero (la
# plantilla de normas, el binario y el modelo) se resuelven contra la carpeta donde está este
# «programator.toml», nunca contra el directorio desde el que lances el programa.
#
# Todas las secciones son opcionales salvo [motor], que hace falta declarar aunque solo sea para
# fijar «modelo»: sin un fichero GGUF no hay nada que arrancar y el programa se niega a arrancar
# sin él. El resto de campos, si se omiten, toman el valor por defecto que se indica en cada
# comentario.

[carpeta]
# Carpeta de trabajo: la raíz del proyecto que contiene ".gestor/canal/".
#
# Cuatro fuentes, de más fuerte a más débil:
#   1. programator.exe --ruta "C:/ruta/a/tu/proyecto"
#   2. esta clave
#   3. la última carpeta en la que se trabajó (se recuerda sola en "ultima-carpeta.txt", junto a
#      este fichero, y se ignora si esa carpeta ya no existe), salvo que "preguntar_siempre" esté
#      puesto, que es como viene de fábrica
#   4. un diálogo nativo para elegirla a mano
#
# Viene comentada a propósito: con una ruta de mentira activa, el programa se niega a arrancar
# diciendo que ese directorio no existe, y eso es un mal primer encuentro. Tal como está, al
# arrancar se abre el diálogo y eliges la carpeta a mano. Descoméntala y pon la tuya cuando
# quieras que vaya sola, que es lo que necesita quien lo dirija desde otro agente.
# ruta = "C:/ruta/a/tu/proyecto"
# Si es "true", Programator abre el diálogo de selección de carpeta en cada arranque en vez de irse
# solo a la última en la que se trabajó. Es lo cómodo cuando vas cambiando de proyecto y no quieres
# tener que borrar "ultima-carpeta.txt" para que deje de insistir con el anterior.
#
# No afecta a las dos fuentes explícitas: si arrancas con "--ruta" o si dejas esta clave "ruta"
# escrita aquí arriba, se va a esa carpeta sin preguntar nada, porque ya se lo has dicho. Así quien
# dirige Programator desde otro agente puede seguir reiniciándolo sin nadie delante.
#
# Por defecto: true.
preguntar_siempre = true

[agente]
# Nombre con el que Programator se identifica ante el equipo. De él sale su buzón: el nombre en
# minúsculas con «.md» («.gestor/canal/programator.md»). Por defecto: "Programator".
nombre = "Programator"
# Plantilla de las instrucciones que se instalan en el proyecto si este aún no tiene las suyas
# (nunca se sobrescribe unas que ya existan). Su sección de verificación no viene escrita: la
# compone el arnés con los comprobadores de [verificacion.comprobadores], para que lo que el modelo
# lee y lo que el arnés ejecuta no puedan divergir.
# Por defecto: "plantillas/instrucciones-del-proyecto.md".
plantilla_normas = "plantillas/instrucciones-del-proyecto.md"
# Las instrucciones de sistema que ve el modelo en cada encargo. Por defecto:
# "plantillas/preambulo-del-modelo.md".
#
# NO son las normas completas del equipo: meterlas enteras en las instrucciones de sistema gastaría
# ventana en un texto que el modelo releería en cada encargo y del que la mayor parte no le aplica.
# El preámbulo trae lo que necesita para actuar. Las normas completas se instalan en
# «.gestor/<agente>/PROGRAMATOR.md» de la carpeta de trabajo (si una instalación de la 0.9.0 o
# anterior dejó un PROGRAMATOR.md en la raíz del proyecto, se usa ese) y el modelo puede leerlas
# con «leer_fichero».
preambulo = "plantillas/preambulo-del-modelo.md"
# Lo que se le recuerda PEGADO AL ENCARGO, no en las instrucciones de sistema. Por defecto:
# "plantillas/recordatorio-de-encargo.md".
#
# La diferencia no es de estilo, está medida: con las normas de código en el mensaje de sistema, el
# modelo las lee y escribe igual que si no las tuviera (1 de 6 comprobaciones mecánicas); con el
# mismo texto pegado al encargo, 5 de 6; y pidiéndole además que declare cómo cumplió cada punto,
# 6 de 6.
recordatorio = "plantillas/recordatorio-de-encargo.md"
# La guía que el arnés deja en el canal para que los demás agentes sepan qué encargarle y qué no.
# Se reescribe en cada arranque. Por defecto: "plantillas/como-encargar-a-programator.md".
guia = "plantillas/como-encargar-a-programator.md"
# El registro de modelos: lo que el banco midió de cada modelo, por clase de encargo. La guía lo
# cuenta a los demás agentes. Lo escribe «programator --registro-anotar <tanda>», nunca a mano.
# Por defecto: "registro-de-modelos.toml", junto a este fichero.
registro_de_modelos = "registro-de-modelos.toml"
# El vigilante del canal de Gestor Agentes que trae el paquete. Si el proyecto no tiene uno en
# .gestor/vigilante/, Programator deja este al arrancar; si ya hay uno, no lo toca. Con él, el
# agente que encarga se entera de que Programator ha respondido, con Gestor Agentes y sin él.
# Por defecto: "vigilante/gestor-vigilante.exe" en Windows y "vigilante/gestor-vigilante" en Linux.
# vigilante = "vigilante/gestor-vigilante.exe"
# Los históricos del canal, que no son buzones de nadie, son los ficheros que empiezan por
# "historico-" o "histórico-", y ningún otro. Ya no hay clave para
# cambiarlos: la antigua «prefijos_ignorados» no se tiene en cuenta y avisa al arrancar.
# Si cada encargo deja la conversación con el modelo, vuelta a vuelta, en
# .gestor/programator/conversacion-<fecha>-<n>.jsonl. Por defecto: false. Sirve para averiguar por
# qué el modelo hizo lo que hizo; lleva el contenido de los ficheros que leyó, así que no lo dejes
# encendido si no lo necesitas.
# registro_de_conversacion = true

[motor]
# Ruta al ejecutable de llama-server. Si se omite, Programator asume que ya hay un servidor
# escuchando en el puerto configurado (por ejemplo, uno que hayas arrancado tú mismo) y no lanza
# ninguno propio.
binario = "herramientas/llama-server.exe"
# Ruta al fichero GGUF del modelo. **Obligatorio**: sin esta clave, Programator no arranca.
# El modelo que fija la especificación del proyecto es devstral-small-2-24b-Q4_K_M.gguf.
modelo = "modelos/devstral-small-2-24b-Q4_K_M.gguf"
# Puerto donde escucha (o debe escuchar) llama-server. Por defecto: 8080.
puerto = 8080
# Tamaño del contexto en tokens que se pide al servidor. Por defecto: 16384.
#
# 16384 y no más: medido el 22/09/2026 sobre el Devstral en una RTX 4070 Ti SUPER, con 16k caben
# casi todas las capas del modelo en la tarjeta y la generación va a 23 tokens por segundo; con
# 32768 bajaba a 15,4 porque cinco capas se iban a la CPU. Súbelo si lo necesitas, sabiendo lo que
# cuesta.
contexto = 16384
# Cuántas conversaciones simultáneas reserva el motor. Por defecto: 1.
#
# Programator atiende los encargos de uno en uno, así que 1 es lo correcto. Subirlo multiplica la
# caché que reserva llama-server y esa VRAM sale de las capas del modelo: con el valor por defecto
# del motor, que son 4, el mismo modelo pasaba de 23 a 9,8 tokens por segundo.
paralelo = 1
# Si cada conversación nueva empieza sin la caché de prefijos de llama-server. Por defecto: true.
#
# Con la caché, el servidor reaprovecha lo que calculó para la petición anterior, y la respuesta
# cambia según lo que se le pidió antes: el mismo encargo, con la misma semilla, dio tres respuestas
# distintas (medido el 12/11/2026). Activado, la misma prueba da el mismo resultado. Cuesta
# reprocesar las instrucciones y el encargo una vez por conversación, unos 10 s; los turnos
# siguientes de la misma conversación siguen aprovechando la caché.
empezar_en_frio = true
# Capas del modelo que se cargan en GPU.
#   "auto"  → Programator mide la VRAM libre, pesa el modelo y decide. Es lo recomendado. Si el
#             banco ya midió ese modelo en esta tarjeta, con el mismo contexto y la misma caché,
#             usa las capas que el banco cargó de verdad, siempre que quepan en la memoria libre
#             (y en vram_maxima_mib, si lo pones). Así no hay que escribir ninguna recomendación:
#             la aplica él. Un número escrito aquí manda sobre todo eso.
#   99      → todas, pase lo que pase. Lo que hacía la 0.3.0.
#   40      → exactamente 40. Lo que escribas aquí se transcribe sin discutir.
# El reparto de capas también cambia la respuesta: con "auto" depende de la memoria libre en ese
# momento, así que si quieres que el mismo encargo dé lo mismo de un día para otro, fija el número.
capas_gpu = "auto"

# VRAM que no se reparte en capas: contexto de CUDA, búferes de cómputo y el margen de seguridad
# entre lo que mide Programator y lo que reserva llama-server. Solo se usa con "auto". Por defecto:
# 512. Con 16 GiB y 32768 de contexto, 512 da 34 capas del Devstral; 1024 daba 32.
margen_vram_mib = 512
# Formato de la caché de claves/valores del modelo. Por defecto: "q8_0".
cache_kv = "q8_0"
# Atención rápida del motor (la opción --flash-attn de llama-server): "on", "off" o "auto".
# Por defecto: "on", que ahorra memoria de la tarjeta y tiempo. Con "auto" decide llama-server.
# llama.cpp la necesita para guardar la caché en un formato reducido como el "q8_0" de cache_kv:
# si la pones en "off", pon también cache_kv = "f16".
flash_attn = "on"

# Tope de memoria de la tarjeta, en MiB, que Programator no supera nunca al repartir el modelo.
# Sirve para decir «como mucho 8 GB» sin tener que pensar en capas, por ejemplo si quieres dejar
# sitio a otro programa que usa la tarjeta. Sin esta línea no hay tope y se usa toda la memoria
# libre, como hasta ahora.
#
# Manda sobre todo lo demás: con "auto", el reparto nunca lo pasa; con un número fijo en
# capas_gpu que no quepa en el tope, Programator baja las capas hasta las que caben y lo avisa al
# arrancar. Bajar el tope deja capas en la CPU, y eso se nota como lentitud.
# vram_maxima_mib = 8192

# Cuándo se suelta el modelo de la tarjeta entre encargos.
#   "auto"  → se queda cargado mientras lleguen encargos, y solo se cambia si el siguiente pide
#             otro modelo. Se suelta tras 15 minutos sin encargos. Es lo recomendado: los encargos
#             seguidos no esperan a que cargue, y si Programator se queda parado la tarjeta se
#             libera sola al cuarto de hora.
#   0       → se suelta al terminar cada encargo. La tarjeta queda libre en cuanto acaba, para
#             juegos u otros programas, pero cada encargo paga la carga del modelo: de unos
#             segundos a más de un minuto según el modelo y el disco.
#   30      → como "auto", pero se suelta tras 30 minutos sin encargos (o los que escribas). Más
#             minutos, más rapidez en encargos espaciados y más tiempo con la tarjeta ocupada.
# Si el motor que escucha en el puerto no lo arrancó Programator, no se suelta nunca: no es suyo.
soltar_modelo = "auto"

# Segundos que se espera a que cargue un modelo distinto cuando un encargo lo pide a mitad de una
# tanda de encargos. Por defecto: 300. Si no carga a tiempo, el encargo no se pierde: queda en la
# cola de pendientes y se atiende en una vuelta posterior.
# espera_de_carga_segundos = 300

# A partir de qué porcentaje de la ventana se avisa de que la conversación va justa. Por defecto: 70.
#
# Cuando la conversación crece demasiado, el motor la rechaza con un código 400 y no hay aviso
# claro de por qué. Este umbral avisa ANTES de que llegue a eso, estimando cuántos tokens ocupa.
# La estimación cuenta bytes, no tokens reales: el arnés no tiene tokenizador. Por defecto es 70 %,
# así que con una ventana de 16384 tokens se avisa al llegar a unos 11468.
umbral_aviso_contexto = 70
# Cuántos bytes se cuentan por token al estimar la ocupación. Por defecto: 4.
#
# Esto depende del modelo y del idioma. 4 es lo habitual en texto latino con el tokenizador de
# Devstral. Si tu conversación ocupa menos espacio del predicho, bájalo; si ocupa más, súbelo.
# La estimación es aproximada: el arnés lo dice cuando avisa.
bytes_por_token = 4

# Plazos máximos de espera HTTP con llama-server (en segundos).
# tiempo_lectura_segundos fija el tiempo de espera por los primeros bytes de la respuesta.
# Por defecto: 600 (10 minutos), holgado para respuestas extensas en hardware más modesto.
# tiempo_escritura_segundos fija el tiempo para escribir la petición en el socket. Por defecto: 60.
# tiempo_lectura_segundos = 600
# tiempo_escritura_segundos = 60


# Con qué se comprueba cada propuesta que escribe el modelo, antes de que nadie se fíe de ella.
#
# Por qué existe: en la evaluación del 22/09/2026, dos de las siete entregas del modelo no
# ejecutaban —un Lua con una «ñ» en un identificador, un SQL con un alias de ventana mal usado— y
# en los dos casos el modelo publicó que había entregado la solución. Nadie se enteró hasta que una
# persona los compiló a mano.
#
# Quién elige los comandos: tú. Ni el arnés los incrusta ni el modelo los elige; él solo pone el
# nombre del fichero, que ya está confinado bajo «.gestor/candidatos/programator/». Cada máquina
# tiene los compiladores que tiene, así que esta lista es tuya.
#
# Sin esta sección no se verifica nada y todo funciona como antes. Lo que NO se hace: ejecutar lo
# que el modelo escribe. Se comprueba que el lenguaje lo acepte, que es otra cosa —«py_compile» no
# corre el fichero—.
[verificacion]
# Cuánto se espera a un comprobador antes de cortarlo. Por defecto: 30. Como mucho 86400 (un día).
tiempo_maximo_segundos = 30
# Si no hay comprobador para «py» en [verificacion.comprobadores], buscar al arrancar un Python
# que responda (primero «python» y luego «python3») y comprobar con él la sintaxis de las
# propuestas .py, sin ejecutarlas ni dejar «__pycache__». La terminal dice cuál encontró o que no
# hay. Por defecto: true.
comprobar_python = true
# La ruta del Python con que comprobar, si no está en el PATH. Vacía, se busca. Por defecto: "".
# python = "C:/Python312/python.exe"
# Cuántos caracteres de lo que dice un comprobador que rechaza se le pasan al modelo para que
# corrija su propuesta. Un error de compilación puede ocupar pantallas enteras y el contexto del
# modelo es finito. Súbelo si usas un modelo con más contexto; 0 vuelve al de fábrica.
# Por defecto: 1200.
maximo_salida_al_modelo = 1200

[verificacion.comprobadores]
# Extensión (sin punto) -> la orden que la comprueba. «{fichero}» se sustituye por la ruta absoluta
# de la propuesta.
#
# Lo que pongas aquí es también lo que el modelo leerá en sus instrucciones: el arnés compone esa
# sección con esta tabla, para que lo que él lee y lo que se ejecuta no puedan divergir.
#
# Dos cosas que conviene saber antes de configurar una:
#   - «{fichero}» es OPCIONAL: una orden sin el marcador se ejecuta igual.
#   - La orden corre en una CARPETA VACÍA PROPIA, «.gestor/programator/verificacion-<marca>/», que
#     se borra al terminar; sus temporales (TEMP, TMP, TMPDIR) también van ahí, así que nada sale
#     de tu carpeta de trabajo. Por eso no sirve poner aquí la compilación del proyecto entero: la propuesta vive en «.gestor/candidatos/programator/», así
#     que esa compilación daría verde sobre un proyecto que no contiene el fichero entregado. Lo
#     que va aquí es la comprobación de UN fichero suelto.
#
# Descomenta las que tengas instaladas y adáptalas a tu máquina; una orden que no exista no rompe
# nada, se dice que no se pudo verificar. Estos son ejemplos, no configuraciones probadas aquí.
#
# Ojo con los comprobadores que dejan restos: «py_compile» escribe el bytecode en un «__pycache__»
# JUNTO AL FICHERO, no en la carpeta donde se ejecuta. Esta variante solo analiza la
# sintaxis y no escribe nada:
# py  = ["python", "-c", "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())", "{fichero}"]
# py  = ["python", "-m", "py_compile", "{fichero}"]   # equivalente, pero deja __pycache__
# lua = ["luac", "-p", "{fichero}"]
# rs  = ["rustc", "--edition", "2021", "--crate-type", "lib", "--emit=metadata", "{fichero}"]
# ts  = ["npx", "tsc", "--noEmit", "{fichero}"]
# cs   = ["csc", "-nologo", "-t:library", "-out:comprobacion.dll", "{fichero}"]
# java = ["javac", "-d", ".", "{fichero}"]
# go   = ["gofmt", "-e", "{fichero}"]

# Cómo comprobar contra un proyecto real, no solo el fichero suelto.
#
# Un fichero de Godot/.NET, de Unity o de cualquier framework con referencias cruzadas no compila
# aislado: necesita el resto del proyecto. La orden de arriba no te sirve para eso, porque corre en
# una carpeta vacía (ver el aviso de dos líneas más arriba). Lo que sí funciona es que
# «{fichero}» apunte a un script tuyo que copie la propuesta DENTRO de una copia de tu proyecto real
# y compile ahí, por ejemplo:
#
#   cs = ["bash", "comprobar-cs.sh", "{fichero}"]
#
# con «comprobar-cs.sh» (tuyo, fuera de este repositorio) copiando «{fichero}» sobre la ruta real
# dentro de una copia de trabajo del proyecto y lanzando «dotnet build» ahí. El arnés no sabe nada
# de tu estructura de proyecto ni la necesita: solo le importa el código de salida del script.

[muestreo]
# Todo lo que hay en esta sección se manda al modelo tal cual en cada petición: es exactamente lo
# que el modelo recibe, sin ningún valor oculto decidido por el servidor.
#
# Temperatura del muestreo: cuanto más alta, respuestas más variadas; cuanto más baja, más
# deterministas. Por defecto: 0.2.
temperatura = 0.2
# Top-k: el modelo solo considera los k tokens más probables en cada paso. Por defecto: 40.
top_k = 40
# Top-p (muestreo por núcleo): el modelo considera el conjunto más pequeño de tokens cuya
# probabilidad acumulada supera p. Por defecto: 0.95.
top_p = 0.95
# Min-p: descarta tokens cuya probabilidad sea inferior a esta fracción de la probabilidad del
# token más probable. Por defecto: 0.05.
min_p = 0.05
# Penalización de repetición: valores por encima de 1.0 desalientan repetir texto ya generado.
# Por defecto: 1.0 (sin penalización).
penalizacion_repeticion = 1.0
# Semilla del sorteo de tokens. El modelo elige cada token sorteando entre los más probables, y la
# semilla es el número con el que empieza ese sorteo: con la misma semilla, la misma petición da
# siempre la misma respuesta. **Va siempre fija**; para pedir otro intento a propósito, cambia el
# número. Por defecto: 42, la de la evaluación del 22/09/2026 y la primera del banco.
semilla = 42

[ciclo]
# Segundos entre cada sondeo del canal. Leer el canal no gasta tokens y es barato. Por defecto: 30.
# Entre 1 y 86400 (un día): por encima se usa un día y se avisa al arrancar.
intervalo_segundos = 30
# Número máximo de llamadas a herramientas que se permiten dentro de un mismo encargo, para cortar
# un bucle improductivo del modelo. Por defecto: 12.
max_herramientas_por_encargo = 12
# Tope de bytes de fichero que se le entregan al modelo en una sola lectura. Por defecto: 16384.
#
# Un buzón real puede pasar de 260 KB: devolver el fichero entero desborda la ventana y mata el
# encargo de golpe. 16 KiB dejan sitio a las normas, a la conversación y a las demás solicitudes
# del encargo. Si cambias el tamaño del contexto en [motor], probablemente quieras cambiar
# también este tope para que el modelo tenga sitio a la conversación.
tope_lectura_bytes = 16384
# Nombre del fichero donde el arnés escribe su estado en cada sondeo. Se guarda en la carpeta
# del agente junto a lectura.json (.gestor/<agente>/). Por defecto: "latido.json".
#
# Por qué existe: el 23/09/2026 quien dirigía creyó que el arnés estaba parado porque lectura.json
# no cambiaba, cuando en realidad estaba atendiendo. Escribir este fichero en cada sondeo permite
# saber si está en reposo, atendiendo o en error, y cuándo será el próximo sondeo.
fichero_latido = "latido.json"
# Cuántas solicitudes anteriores se recuerdan para detectar repeticiones exactas y no volver a
# ejecutarlas. Por defecto: 12.
#
# Por qué existe: en una jornada de uso real (23/09/2026), el modelo repitió cinco
# veces la misma llamada a «escribir_propuesta» con el mismo contenido, consumiendo el cupo de
# herramientas y abortando el encargo. Recordar las llamadas anteriores permite devolver el
# resultado previo sin gastar cupo ni reescribir disco, advirtiendo al modelo para que rectifique.
max_repeticiones_recordadas = 12
# Cuántas veces se reintenta una llamada al motor cuando falla pero la comprobación de salud indica
# que el servidor sigue vivo. Por defecto: 2.
#
# Por qué existe: en una jornada de uso real (23/09/2026), un encargo se abortó
# con «el motor local no respondió» debido a contención transitoria de GPU con un renderizado de
# Godot, a pesar de que llama-server seguía vivo y minutos después /health devolvía 200 {"status":"ok"}.
# Permitir reintentos evita perder encargos cuando la GPU compite con otras tareas de la máquina.
max_reintentos_motor = 2
# Segundos de espera entre cada reintento tras un fallo transitorio del motor. Por defecto: 5.
#
# Da margen a que la contención de GPU disminuya antes de volver a solicitar inferencia.
espera_reintento_motor_segundos = 5
# Número máximo de veces seguidas que el modelo puede insistir en una misma herramienta denegada
# antes de abortar el encargo. Por defecto: 2, la regla de los dos intentos de los agentes.
#
# Si el modelo insiste en una herramienta que el arnés acaba de denegarle con el mismo nombre,
# se le devuelve aviso para que rectifique. Si alcanza este tope consecutivo, el encargo se aborta
# para evitar bucles improductivos. Un modelo más modesto puede necesitar más margen, o uno que se
# atasca puede requerir cortar antes.
max_denegaciones_seguidas = 2
# Ningún encargo se pierde en silencio. Si no hay un modelo con el que atenderlo (falta su
# fichero o no cabe en la tarjeta), no se intenta: se responde en el acto a quien lo pidió, con el
# motivo y la forma de conseguir uno («revisión: buscar»). Si falla por otra causa (el modelo no
# termina de cargar a tiempo, el motor se cierra, la respuesta no se puede publicar), se guarda en
# la cola de pendientes, junto a lectura.json, y se vuelve a intentar en la vuelta siguiente,
# antes que los encargos nuevos.
#
# Tras cuántos intentos fallidos se cierra el encargo: sale de la cola y se le responde a quien lo
# pidió con el motivo. Por defecto: 2, la regla de los dos intentos de los agentes.
intentos_por_encargo = 2

[actualizaciones]
# Si Programator comprueba, al arrancar, si hay una versión más nueva publicada en GitHub. Por
# defecto: true.
#
# Solo avisa: no descarga nada, no reemplaza el ejecutable y no decide nada por ti. Y nunca puede
# impedir que Programator arranque — sin red, con GitHub caído o fuera del tiempo de espera, la
# comprobación se calla sin más y el arranque sigue exactamente igual que si esto no existiera.
comprobar = true
# Repositorio de GitHub (propietario/nombre) contra el que se compara la versión instalada.
# Por defecto: "celtidcs/Programator".
repositorio = "celtidcs/Programator"
# Cuánto se espera a GitHub antes de rendirse, en segundos. Por defecto: 3. Cero no vale, y
# la comprobación se salta avisando de por qué.
#
# Corto a propósito: es una comprobación informativa sobre una máquina que ya va a tardar minutos
# en atender un encargo. Corre mientras el arranque mide la máquina, así que casi nunca se nota.
#
# La consulta sale por el proxy del sistema: las variables HTTPS_PROXY y similares y, en Windows,
# el de las opciones de internet. Detrás de un proxy con configuración automática (PAC) define
# HTTPS_PROXY antes de abrir Programator.
tiempo_espera_segundos = 3

[revision]
# La revisión de modelos: buscar candidatos en Hugging Face, descargarlos, pasarles el banco y
# quedarse con el mejor de cada clase. La usan las órdenes «--revision-buscar»,
# «--descargar-modelo», «--revision-proponer» y «--retirar-modelo», y los encargos de revisión que
# un agente deja en el canal (abajo, «identidades_que_ordenan»).
#
# Antes de buscar, «revisión: buscar» y «--revision-buscar» reponen los modelos del registro que
# faltan en «carpeta_de_modelos» y siguen ganando algo (o son el modelo por defecto): los bajan de
# nuevo del repositorio del que salieron, comprobando que es el mismo fichero que se midió. Los que
# faltan y ya no ganan nada salen del registro. No hace falta ninguna clave para esto: usa las de
# la descarga.
#
# Las búsquedas que se hacen en Hugging Face: cada una es el parámetro «search» de la API. Son un
# punto de partida; ajústalas a lo que quieras probar.
busquedas = ["coder GGUF", "devstral GGUF", "code instruct GGUF"]
# Solo repositorios de esta biblioteca. Por defecto: "gguf", lo que sabe cargar llama-server.
biblioteca = "gguf"
# Cuántos resultados se piden por búsqueda, los de más descargas. Por defecto: 50.
resultados_por_busqueda = 50
# Solo los modificados en este número de días. 0 quita el filtro. Por defecto: 62, dos meses, para
# que una revisión que se salte un mes no pierda nada.
modificados_en_los_ultimos_dias = 62
# Las cuantizaciones que interesan, en orden de preferencia. De cada repositorio se toma un fichero
# por cuantización.
cuantizaciones = ["Q4_K_M", "Q5_K_M", "Q6_K", "Q8_0"]
# Lo que se reserva de la tarjeta para el contexto y el motor al decidir si un fichero cabe, en
# MiB. Por defecto: 2048. Es una cota: el encaje exacto se calcula al pasar el banco. Si un modelo
# que te interesa sale descartado por poco, bájala.
reserva_mib = 2048
# Dónde se guardan las revisiones, relativo a la carpeta del ejecutable. Por defecto: "revisiones".
carpeta = "revisiones"
# Cuánto se espera a Hugging Face, en segundos. Por defecto: 30.
tiempo_espera_segundos = 30
# La dirección de la API de Hugging Face.
api = "https://huggingface.co/api"
# La web de Hugging Face: el enlace de cada candidato y de donde se descargan sus ficheros.
sitio = "https://huggingface.co"
# Dónde están los modelos, relativo a la carpeta del ejecutable: ahí se mira qué hay ya
# descargado y ahí se deja cada descarga, también la de los modelos útiles que se reponen porque
# faltaban. Por defecto: "modelos".
carpeta_de_modelos = "modelos"
# Lo que se deja libre en el disco además del fichero al descargar, en MiB. Por defecto: 1024.
margen_disco_mib = 1024
# Cada cuántos MiB descargados se dice el avance. Por defecto: 512.
avisar_cada_mib = 512
#
# La revisión por encargo: un agente (Claude, Codex, Gemini u otro) le pide a Programator, por el canal, «revisión:
# buscar», «revisión: probar» y «revisión: cerrar», y Programator lo hace solo, sin preguntar.
# Las identidades que pueden pedirla, tal como las declara cada agente en la primera línea de su
# buzón («# Bandeja de Claude 1»), por ejemplo ["Claude 1"]. Un buzón sin esa línea no puede
# pedirla. Vacía, por defecto: nadie puede, y Programator lo contesta en el canal. La antigua
# «buzones_que_ordenan», con nombres de fichero, ya no vale y avisa al arrancar.
identidades_que_ordenan = []
# Cuántos candidatos se prueban como mucho en una revisión. Cada uno ocupa la GPU unas dos o tres
# horas. Por defecto: 3.
candidatos_por_revision = 3
# Las pruebas ocultas de cada tanda se ejecutan en este equipo, sin pedir autorización. Van
# encendidas por defecto, también si el banco.toml de la carpeta del banco no trae
# «[comprobacion_local]», y solo se apagan con «activa = false» en esa sección. Si las de un encargo
# de código no dan nota (apagadas, o sin poder ejecutarse) y el encargo trae «rubrica.md», su código
# se puntúa por rúbrica, leyéndolo; sin «rubrica.md», queda «no evaluado».
# La carpeta del banco, relativa a la del ejecutable. Por defecto: "banco".
carpeta_del_banco = "banco"
