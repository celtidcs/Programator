[[comprobaciones]]
nombre = "sus_propias_pruebas_pasan"
orden = "cargo test --quiet --lib"

[[texto]]
nombre = "sin unwrap fuera de las pruebas"
patron = ".unwrap()"
maximo = 0
antes_de = "#[cfg(test)]"

[[texto]]
nombre = "sin expect fuera de las pruebas"
patron = ".expect("
maximo = 0
antes_de = "#[cfg(test)]"

[[texto]]
nombre = "ErrorRango es un enum propio"
patron = "enum ErrorRango"
minimo = 1

[[texto]]
nombre = "al menos cinco pruebas"
patron = "#[test]"
