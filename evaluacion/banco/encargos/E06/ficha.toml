id = "E06"
titulo = "C#: lector asíncrono de un fichero por lotes"
familia = "oficio"
entrega = "LectorLotes.cs"
colocar_en = "LectorLotes.cs"
herramientas = ["dotnet"]

# Restaura con NuGet. Es lo único con red: no toca el código del modelo.
[preparar]
orden = "dotnet restore --nologo -v q"

[compilar]
orden = "dotnet build --no-restore --nologo -v q -c Release -o salida"

[[comprobaciones]]
nombre = "lotea_siete_lineas_de_tres_en_tres"
orden = "dotnet salida/banco_e06.dll lotea_siete_lineas_de_tres_en_tres"

[[comprobaciones]]
