[[comprobaciones]]
nombre = "tamano_cero_lanza_argument_out_of_range"
orden = "dotnet salida/banco_e06.dll tamano_cero_lanza_argument_out_of_range"

[[comprobaciones]]
nombre = "tamano_negativo_lanza_argument_out_of_range"
orden = "dotnet salida/banco_e06.dll tamano_negativo_lanza_argument_out_of_range"

[[comprobaciones]]
