# Comprobado el 10/11/2026: serde_json::Value no tiene deep_merge. Existe como extensión en el
# crate dts (ValueExt::deep_merge), que el enunciado excluye al pedir el método del propio
# serde_json. Las alternativas reales son escribir la fusión a mano o crates como json-patch
# (merge según RFC 7396).
