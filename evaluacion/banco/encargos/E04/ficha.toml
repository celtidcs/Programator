id = "E04"
titulo = "TypeScript: validador de configuración con unión discriminada"
familia = "oficio"
entrega = "config.ts"
colocar_en = "config.ts"
herramientas = ["node"]

# Descarga la versión de TypeScript fijada en package.json. Es lo único con red: no toca el código
# del modelo.
[preparar]
orden = "npm install --silent --no-audit --no-fund"

# Compila en modo estricto, ya sin red.
[compilar]
orden = "npx tsc -p ."

