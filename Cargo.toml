[package]
name = "programator"
version = "0.10.1"
edition = "2021"
description = "Arnés que convierte un modelo local en un agente del canal .gestor"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/celtidcs/Programator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
thiserror = "1"
rfd = "0.14"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Solo para construir en Windows: incrusta el icono y los datos de versión en el .exe. No entra
# en el binario como código, únicamente lo fabrica.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }
