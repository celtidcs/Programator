# Empaqueta los portables y los sube a la Release al empujar una etiqueta de versión.
#
# Se activa ante cualquier etiqueta 'v*'. Compila en Windows y en Linux y empaqueta con el único
# empaquetador, empaquetado/empaquetar.ps1, según la única lista, empaquetado/contenido.txt. El
# guion compara el paquete con la lista y falla si no coincide: un paquete distinto no se sube.
#
# Este flujo nunca crea la Release. La crea quien publica, en borrador y con las notas en prosa,
# antes de empujar la etiqueta; aquí solo se le adjuntan los paquetes. Si la Release no existe, el
# flujo falla en vez de crear una con notas automáticas.

name: Publicación de Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  empaquetar:
    name: Empaquetar ${{ matrix.sistema }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows
            runner: windows-latest
            binario: target/release/programator.exe
            paquete: zip
          - sistema: linux
            runner: ubuntu-latest
            binario: target/release/programator
            paquete: tar.gz
    steps:
      - name: Traer el código
        uses: actions/checkout@v7

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reutilizar compilación previa
        uses: Swatinem/rust-cache@v2

      - name: Compilar binario release
        run: cargo build --release

      - name: Traer el vigilante de Gestor Agentes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./empaquetado/traer-vigilante.ps1 -Sistema "${{ matrix.sistema }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empaquetar y comprobar contra la lista
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./empaquetado/empaquetar.ps1 -Binario "${{ matrix.binario }}" -Sistema "${{ matrix.sistema }}" -Version $version -Salida paquete
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el paquete a la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $paquete = "paquete/programator-$version-${{ matrix.sistema }}-x86_64.${{ matrix.paquete }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "La Release $tag no existe: hay que crearla, en borrador y con sus notas, antes de empujar la etiqueta."
              exit 1
          }
          gh release upload $tag $paquete --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
